<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritorio en vivo</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1318; --bar:#1a2027; --text:#e6eaef; --muted:#9aa5b1; --accent:#5fae86; --border:#2e3843; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--bar); border-bottom:1px solid var(--border); }
  .bar strong { margin-right:auto; }
  input { background:#0f1318; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 9px; font:inherit; width:180px; }
  button { background:var(--accent); color:#0d1410; border:0; border-radius:6px; padding:8px 12px; font:inherit; font-weight:600; cursor:pointer; }
  #estado { color:var(--muted); }
  #pantalla { position:absolute; inset:56px 0 0 0; }
  @media (max-width: 600px) { #pantalla { inset:96px 0 0 0; } }
</style>
</head>
<body>
  <div class="bar">
    <strong>Escritorio en vivo · solo mirar</strong>
    <span id="estado">Desconectado</span>
    <input id="clave" type="password" placeholder="Contraseña VNC" autocomplete="off">
    <button id="conectar">Conectar</button>
  </div>
  <div id="pantalla"></div>
<script type="module">
  import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';
  const $ = (id) => document.getElementById(id);
  let rfb = null;
  function conectar() {
    if (rfb) { rfb.disconnect(); rfb = null; }
    const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/websockify`;
    $('estado').textContent = 'Conectando…';
    rfb = new RFB($('pantalla'), url, { credentials: { password: $('clave').value } });
    rfb.viewOnly = true;          // nadie interfiere con el agente desde aquí
    rfb.scaleViewport = true;
    rfb.addEventListener('connect', () => { $('estado').textContent = 'Conectado'; });
    rfb.addEventListener('disconnect', (e) => { $('estado').textContent = e.detail.clean ? 'Desconectado' : 'Se perdió la conexión'; });
    rfb.addEventListener('securityfailure', () => { $('estado').textContent = 'Contraseña incorrecta'; });
  }
  $('conectar').onclick = conectar;
  $('clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') conectar(); });
</script>
</body>
</html>
